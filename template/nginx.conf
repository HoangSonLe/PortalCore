server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # File build có hash trong tên -> cache lâu.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # env.js và index.html luôn lấy bản mới (đổi env / deploy bản mới là thấy ngay).
  location = /env.js {
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Bỏ comment để nginx chuyển /api sang backend (khi VITE_API_URL để trống).
  # location /api/ {
  #   proxy_pass http://backend:8080/api/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  # }

  # SPA: mọi đường dẫn khác trả index.html cho React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
