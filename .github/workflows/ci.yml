name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Build · Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Cài core từ tarball vào app tạo từ template/ rồi build — bắt lỗi đóng gói.
      - run: npm run smoke

  e2e:
    name: E2E (Chrome)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chạy preview
        run: |
          npx vite --config preview/vite.config.ts --port 5180 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5180 > /dev/null && break; sleep 1; done
      - name: E2E
        run: npm run e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Lưu ảnh chụp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots
          retention-days: 7
